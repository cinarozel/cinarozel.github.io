<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cihaz Envanteri | cinarozel.github.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const userLang = navigator.language || navigator.userLanguage;
        document.documentElement.lang = userLang.startsWith('tr') ? 'tr' : 'en';

        tailwind.config = {
            darkMode: 'media',
            theme: { extend: { colors: { darkBg: '#0f172a' } } }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-950 p-6 md:p-12 transition-colors duration-300">
    <div class="max-w-4xl mx-auto text-slate-900 dark:text-slate-100">
        <header class="mb-12 border-b dark:border-slate-800 pb-6">
            <h1 class="text-4xl font-black tracking-tight">Cihazlarım</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2 font-medium">Cihaz Envanteri</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8">
            <a href="/devices/STK-L21" class="group bg-white dark:bg-slate-900 rounded-3xl border border-gray-200 dark:border-slate-800 shadow-sm hover:shadow-2xl hover:-translate-y-1 transition-all duration-300 overflow-hidden">
                <div class="aspect-video bg-gray-100 dark:bg-slate-800 flex items-center justify-center p-8">
                    <img src="https://consumer.huawei.com/dam/content/dam/huawei-cbg-site/common/mkt/list-image/phones/huawei-p-smart-pro/huawei-p-smart-pro-listImage-breathing-crystal-new.png"
                         class="h-full object-contain group-hover:scale-110 transition-transform duration-500">
                </div>
                <div class="p-6 border-t dark:border-slate-800">
                    <div class="flex justify-between items-start mb-2">
                        <h2 class="text-2xl font-bold">HUAWEI P Smart Pro</h2>
                        <span class="text-[10px] font-bold bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 px-2 py-1 rounded">STK-L21</span>
                    </div>
                    <div class="mt-6 flex items-center text-blue-600 dark:text-blue-400 text-sm font-bold">
                        İncele ve Arşive Bak
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2 group-hover:translate-x-2 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </div>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
