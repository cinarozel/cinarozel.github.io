<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cihaz Envanterim | Çınar Özel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        const userLang = navigator.language || navigator.userLanguage;
        if (!userLang.startsWith('tr') && !window.location.search.includes('lang')) {
            console.log("International user detected: " + userLang);
        }

        tailwind.config = {
            darkMode: 'media',
            theme: { extend: { colors: { darkBg: '#0f172a' } } }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-950 p-6 md:p-12 transition-colors duration-300">
    <div class="max-w-4xl mx-auto text-slate-900 dark:text-slate-100">
        <header class="mb-12 border-b dark:border-slate-800 pb-6">
            <h1 class="text-4xl font-black">Cihazlarım</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2">Envanter ve Teknik Arşiv</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <a href="/devices/STK-L21" class="group bg-white dark:bg-slate-900 rounded-3xl border border-gray-200 dark:border-slate-800 shadow-sm hover:shadow-xl transition-all overflow-hidden">
                <div class="aspect-square bg-gray-100 dark:bg-slate-800 flex items-center justify-center p-8">
                    <img src="https://consumer.huawei.com/dam/content/dam/huawei-cbg-site/common/mkt/list-image/phones/huawei-p-smart-pro/huawei-p-smart-pro-listImage-breathing-crystal-new.png"
                         class="h-full object-contain group-hover:scale-110 transition-transform duration-500">
                </div>
                <div class="p-6">
                    <h2 class="text-xl font-bold">P Smart Pro</h2>
                    <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">STK-L21 • Pop-up Kamera</p>
                    <div class="mt-4 text-blue-600 dark:text-blue-400 text-sm font-bold italic">İncele →</div>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
